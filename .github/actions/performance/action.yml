name: 'Apply Performance Patches'
description: 'Apply experimental kernel patches with version-specific logic'
runs:
  using: 'composite'
  steps:
    - name: Apply Experimental Patches
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        # Aplica un parche; si ya esta aplicado en la fuente, lo omite sin error.
        apply_patch() {
          local p="$1"; shift
          if patch -p1 -R --dry-run -s "$@" < "$p" >/dev/null 2>&1; then
            echo "[=] Ya aplicado, omito: $(basename "$p")"
            return 0
          fi
          echo "[+] Aplicando: $(basename "$p")"
          patch -p1 --forward "$@" < "$p"
        }

        K="${{ github.workspace }}/kernel_patches/common"

        apply_patch "$K/optimized_mem_operations.patch"
        apply_patch "$K/file_struct_8bytes_align.patch"
        apply_patch "$K/reduce_cache_pressure.patch"

        apply_patch "$K/mem_opt_prefetch.patch"

        apply_patch "$K/minimise_wakeup_time.patch"
        apply_patch "$K/int_sqrt.patch"
        apply_patch "$K/reduce_gc_thread_sleep_time.patch"
        apply_patch "$K/add_timeout_wakelocks_globally.patch"
        apply_patch "$K/f2fs_reduce_congestion.patch"
        apply_patch "$K/reduce_freeze_timeout.patch"

        apply_patch "$K/clear_page_16bytes_align.patch"

        echo "Patching avoid_extra_s2idle_wake_attempts.patch"
        FILE="drivers/base/power/wakeup.c"
        # Check if the function exists
        if grep -q "^void pm_system_wakeup(void)" "$FILE"; then
            # Check if the line exists inside the function
            if sed -n '/^void pm_system_wakeup(void)/,/^}/p' "$FILE" | grep -q 'suspend_abort_fs_sync();'; then
                # Remove the line
                sed -i '/^void pm_system_wakeup(void)/,/^}/{
                    /suspend_abort_fs_sync();/d
                }' "$FILE"
            fi
        fi
        apply_patch -F3 "$K/avoid_extra_s2idle_wake_attempts.patch"
        apply_patch -F3 "$K/disable_cache_hot_buddy.patch"
        apply_patch -F3 "$K/f2fs_enlarge_min_fsync_blocks.patch"
        apply_patch -F3 "$K/increase_ext4_default_commit_age.patch"
        apply_patch -F3 "$K/increase_sk_mem_packets.patch"
        apply_patch -F3 "$K/reduce_pci_pme_wakeups.patch"
        apply_patch -F3 "$K/silence_irq_cpu_logspam.patch"
        apply_patch -F3 "$K/silence_system_logspam.patch"

        echo "[+] Other patches applied"
