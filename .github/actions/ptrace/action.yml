name: 'Apply Ptrace Patch'
description: 'GKI ptrace compatibility patch (kernels < 5.16)'

runs:
  using: 'composite'
  steps:
    - name: Apply Ptrace Patch
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        # Si el parche ya esta aplicado en la fuente, lo omite sin error.
        P="${{ github.workspace }}/kernel_patches/gki_ptrace.patch"
        if patch -p1 -F 3 -R --dry-run -s < "$P" >/dev/null 2>&1; then
          echo "[=] Ptrace ya aplicado, omito"
        else
          echo "[+] Aplicando gki_ptrace.patch"
          patch -p1 -F 3 --forward < "$P"
        fi
